<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportingCity</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Cabecalho / Navbar -->
    <header class="navbar">
        <div class="logo">
            <!-- Imagem de logo placeholder (bola de futebol genérica) -->
            <img src="https://cdn-icons-png.flaticon.com/512/1165/1165181.png" class="logo-img" alt="Logo SportingCity">
        </div>
        
        <nav class="menu">
            <a href="#">Início</a>
            <a href="#">Quadras</a>
            <a href="#">Filiais</a>
            <a href="#">Torneios</a>
        </nav>

        <div class="acoes">
            <input type="text" class="pesquisa" placeholder="Pesquise...">
            <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png" class="lupa-icon" alt="Buscar">
            
            <div class="icone-perfil-nav">
                <div class="head-icon-nav"></div>
                <div class="body-icon-nav"></div>
            </div>
        </div>
    </header>

    <!-- Conteudo Principal -->
    <main class="container-login">
        <div class="card-login">
            <div class="topo-card">
                <div class="icone-login">
                    <div class="head-icon"></div>
                    <div class="body-icon"></div>
                </div>
                <h1 class="titulo-login">Login</h1>
            </div>

            <form class="formulario">
                <label for="email">Telefone/Email:</label>
                <input type="text" id="email" class="input-login">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="input-login">
                
                <a href="#" class="esqueci-senha">Esqueci minha senha.</a>

                <p class="cadastro">Não possui uma conta? <a href="#">Cadastre-se aqui!</a></p>
            </form>
        </div>
    </main>

</body>
</html>
